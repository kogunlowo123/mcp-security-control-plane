[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-core"
version = "0.1.0"
description = "RAG core ingestion and retrieval for MCP Security Control Plane"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "sentence-transformers>=3.0",
    "psycopg2-binary>=2.9",
    "opensearch-py>=2.6",
    "boto3>=1.34",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-core>=0.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "pypdf>=4.0",
    "pdfminer.six>=20221105",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "pytest-cov>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
