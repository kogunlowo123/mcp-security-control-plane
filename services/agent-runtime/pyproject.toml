[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "MCP Security Control Plane - Agent Runtime Service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MCP Security Team" }]

dependencies = [
    "langgraph>=0.2",
    "langchain>=0.2",
    "langchain-aws>=0.1",
    "litellm>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "boto3>=1.34",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-api>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "tenacity>=8.3",
    "structlog>=24.1",
    "aioboto3>=12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
