name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.4.29"
  AWS_REGION: "us-east-1"

permissions:
  contents: read
  id-token: write
  security-events: write
  pull-requests: write

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          install-dev: "true"

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run mypy type checking
        run: mypy . --show-error-codes

      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: warning

  # ─── Unit Tests ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          install-dev: "true"

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junit-xml=test-results.xml \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == env.PYTHON_VERSION
        with:
          files: coverage.xml
          flags: unit
          name: unit-${{ matrix.python-version }}

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
          check_name: Unit Tests (${{ matrix.python-version }})

  # ─── Integration Tests ───────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcp_scp_test
          POSTGRES_USER: mcp_scp
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          install-dev: "true"

      - name: Run integration tests
        env:
          DATABASE_URL: "postgresql://mcp_scp:test_password@localhost:5432/mcp_scp_test"
          REDIS_URL: "redis://localhost:6379/0"
          ENVIRONMENT: "test"
          LOG_LEVEL: "DEBUG"
        run: |
          pytest tests/integration/ \
            --cov=. \
            --cov-report=xml:coverage-integration.xml \
            --junit-xml=test-results-integration.xml \
            -v \
            --timeout=120

      - name: Upload integration coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage-integration.xml
          flags: integration

  # ─── Security Scan ───────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          install-dev: "true"

      - name: Run Bandit SAST
        run: |
          bandit -r . \
            -x tests/ \
            -f json \
            -o bandit-results.json \
            --severity-level medium \
            --confidence-level medium
        continue-on-error: true

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.json

      - name: Run Safety dependency check
        run: |
          safety check --json --output safety-results.json
        continue-on-error: true

      - name: Upload Safety results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-results
          path: safety-results.json

      - name: Run pip-audit
        run: |
          pip-audit --format=json --output=pip-audit-results.json
        continue-on-error: true

  # ─── Build Docker Images ─────────────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
          - name: policy-engine
            context: ./services/policy-engine
            dockerfile: ./services/policy-engine/Dockerfile
          - name: audit-logger
            context: ./services/audit-logger
            dockerfile: ./services/audit-logger/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Build and push ${{ matrix.service.name }}
        uses: ./.github/actions/docker-build-push
        with:
          aws-role-arn: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          ecr-repository: mcp-scp/${{ matrix.service.name }}
          image-tag: ${{ github.sha }}
          context: ${{ matrix.service.context }}
          dockerfile: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          scan-image: "true"
          scan-severity: "CRITICAL,HIGH"
          additional-tags: ${{ github.ref == 'refs/heads/main' && 'latest' || '' }}

  # ─── Summary Gate ────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, security-scan, build-images]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v['result'] not in ('success', 'skipped')]
          if failed:
              print('FAILED: ' + ', '.join(failed))
              sys.exit(1)
          print('All required jobs passed.')
          ")
