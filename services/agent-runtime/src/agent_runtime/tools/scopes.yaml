# Tool Scope Definitions
# Defines the allowed scopes per tool, permission levels, and enforcement rules.

version: "1.0.0"

# ── Scope taxonomy ────────────────────────────────────────────────────────────
scope_levels:
  read-only:
    description: "Can query and retrieve data but never mutate state"
    rank: 1
    allowed_operations:
      - list
      - get
      - search
      - query
      - read
      - count

  read-write:
    description: "Can read data and create/update non-destructive records"
    rank: 2
    allowed_operations:
      - list
      - get
      - search
      - query
      - read
      - count
      - create
      - update
      - append

  admin:
    description: "Full CRUD including destructive operations and policy changes"
    rank: 3
    allowed_operations:
      - list
      - get
      - search
      - query
      - read
      - count
      - create
      - update
      - append
      - delete
      - revoke
      - grant
      - rotate

# ── Tool scope assignments ────────────────────────────────────────────────────
tools:
  rag_search:
    allowed_scopes:
      - read-only
    default_scope: read-only
    tier_minimum: T1
    description: "RAG hybrid retrieval over security policy corpus. Read-only."
    parameters:
      query:
        type: string
        required: true
        max_length: 2048
      top_k:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
      min_score:
        type: number
        minimum: 0.0
        maximum: 1.0
        default: 0.0
      filter_tags:
        type: array
        items:
          type: string
        required: false

  mcp_audit_query:
    allowed_scopes:
      - read-only
    default_scope: read-only
    tier_minimum: T0
    description: "Query audit_log table. Read-only, paginated."
    parameters:
      agent_id:
        type: string
        required: false
      tool_name:
        type: string
        required: false
      start_time:
        type: string
        format: date-time
        required: false
      end_time:
        type: string
        format: date-time
        required: false
      decision:
        type: string
        enum: ["ALLOW", "BLOCK", "PENDING"]
        required: false
      page:
        type: integer
        minimum: 1
        default: 1
      page_size:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  tool_catalog:
    allowed_scopes:
      - read-only
    default_scope: read-only
    tier_minimum: T0
    description: "List and inspect approved tools from the tool catalog. Read-only."
    parameters:
      tier_filter:
        type: string
        enum: ["T0", "T1"]
        required: false
      scope_filter:
        type: string
        enum: ["read-only", "read-write", "admin"]
        required: false
      name_contains:
        type: string
        required: false

# ── Scope violation rules ─────────────────────────────────────────────────────
violation_rules:
  - rule_id: SCOPE-001
    name: "Tier bypass attempt"
    description: "Agent calling a tool above its tier"
    severity: HIGH
    pattern: "caller_tier < tool_min_tier"

  - rule_id: SCOPE-002
    name: "Scope escalation"
    description: "Agent performing write operation with read-only scope"
    severity: HIGH
    pattern: "operation not in allowed_operations for granted_scope"

  - rule_id: SCOPE-003
    name: "Admin operation without admin scope"
    description: "Destructive or policy-altering operation without admin grant"
    severity: CRITICAL
    pattern: "operation in admin_operations and granted_scope != admin"

  - rule_id: SCOPE-004
    name: "Cross-agent tool access"
    description: "Agent using a tool granted only to a different agent_id"
    severity: HIGH
    pattern: "tool_id not in caller_agent.tool_grants"

  - rule_id: SCOPE-005
    name: "Parameter value out of allowed range"
    description: "Parameter value exceeds defined bounds for the tool scope"
    severity: MEDIUM
    pattern: "param_value outside parameter.bounds"
