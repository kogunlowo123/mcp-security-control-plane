[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-security-api"
version = "0.1.0"
description = "MCP Security Control Plane API Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "cryptography>=42",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.hatch.envs.default]
python = "3.12"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
