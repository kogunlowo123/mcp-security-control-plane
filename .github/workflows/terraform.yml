name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
      - ".github/actions/setup-terraform/**"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
      - ".github/actions/setup-terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to target
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: Terraform action to run
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

concurrency:
  group: terraform-${{ github.ref }}-${{ inputs.environment || 'all' }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.8.5"
  AWS_REGION: "us-east-1"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ─── Detect Changed Environments ─────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Environments
    runs-on: ubuntu-latest
    outputs:
      dev-changed: ${{ steps.filter.outputs.dev }}
      staging-changed: ${{ steps.filter.outputs.staging }}
      prod-changed: ${{ steps.filter.outputs.prod }}
      shared-changed: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dev:
              - 'infra/environments/dev/**'
              - 'infra/modules/**'
            staging:
              - 'infra/environments/staging/**'
              - 'infra/modules/**'
            prod:
              - 'infra/environments/prod/**'
              - 'infra/modules/**'
            shared:
              - 'infra/modules/**'
              - 'infra/shared/**'

  # ─── Terraform Plan: Dev ─────────────────────────────────────────────────────
  plan-dev:
    name: Plan (dev)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.dev-changed == 'true' ||
      needs.detect-changes.outputs.shared-changed == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    environment: dev
    env:
      TF_VAR_environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ./infra/environments/dev
          environment: dev
          aws-role-arn: ${{ secrets.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          backend-bucket: ${{ secrets.TF_STATE_BUCKET }}
          backend-dynamodb-table: ${{ secrets.TF_LOCK_TABLE }}

      - name: Terraform Plan
        id: plan
        working-directory: ./infra/environments/dev
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan \
            -detailed-exitcode \
            2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Save plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev-${{ github.sha }}
          path: ./infra/environments/dev/tfplan
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('./infra/environments/dev/plan-output.txt', 'utf8');
            const truncated = planOutput.length > 60000 ? planOutput.slice(0, 60000) + '\n...(truncated)' : planOutput;
            const body = `### Terraform Plan — dev
            \`\`\`terraform
            ${truncated}
            \`\`\`
            *Triggered by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ─── Terraform Apply: Dev ────────────────────────────────────────────────────
  apply-dev:
    name: Apply (dev)
    runs-on: ubuntu-latest
    needs: plan-dev
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' && inputs.action == 'apply')
    environment: dev
    env:
      TF_VAR_environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ./infra/environments/dev
          environment: dev
          aws-role-arn: ${{ secrets.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          backend-bucket: ${{ secrets.TF_STATE_BUCKET }}
          backend-dynamodb-table: ${{ secrets.TF_LOCK_TABLE }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev-${{ github.sha }}
          path: ./infra/environments/dev

      - name: Terraform Apply
        working-directory: ./infra/environments/dev
        run: |
          terraform apply -auto-approve tfplan

  # ─── Terraform Plan: Staging ─────────────────────────────────────────────────
  plan-staging:
    name: Plan (staging)
    runs-on: ubuntu-latest
    needs: [detect-changes, apply-dev]
    if: |
      (needs.detect-changes.outputs.staging-changed == 'true' ||
      needs.detect-changes.outputs.shared-changed == 'true') &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment: staging
    env:
      TF_VAR_environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ./infra/environments/staging
          environment: staging
          aws-role-arn: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          backend-bucket: ${{ secrets.TF_STATE_BUCKET }}
          backend-dynamodb-table: ${{ secrets.TF_LOCK_TABLE }}

      - name: Terraform Plan
        id: plan
        working-directory: ./infra/environments/staging
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true

      - name: Save plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging-${{ github.sha }}
          path: ./infra/environments/staging/tfplan
          retention-days: 5

  # ─── Terraform Apply: Staging ────────────────────────────────────────────────
  apply-staging:
    name: Apply (staging)
    runs-on: ubuntu-latest
    needs: plan-staging
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && inputs.action == 'apply')
    environment: staging
    env:
      TF_VAR_environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ./infra/environments/staging
          environment: staging
          aws-role-arn: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          backend-bucket: ${{ secrets.TF_STATE_BUCKET }}
          backend-dynamodb-table: ${{ secrets.TF_LOCK_TABLE }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging-${{ github.sha }}
          path: ./infra/environments/staging

      - name: Terraform Apply
        working-directory: ./infra/environments/staging
        run: |
          terraform apply -auto-approve tfplan

  # ─── Terraform Plan: Production ──────────────────────────────────────────────
  plan-prod:
    name: Plan (prod)
    runs-on: ubuntu-latest
    needs: [detect-changes, apply-staging]
    if: |
      (needs.detect-changes.outputs.prod-changed == 'true' ||
      needs.detect-changes.outputs.shared-changed == 'true') &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    environment: prod-plan
    env:
      TF_VAR_environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ./infra/environments/prod
          environment: prod
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          backend-bucket: ${{ secrets.TF_STATE_BUCKET }}
          backend-dynamodb-table: ${{ secrets.TF_LOCK_TABLE }}

      - name: Terraform Plan
        id: plan
        working-directory: ./infra/environments/prod
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true

      - name: Save plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-${{ github.sha }}
          path: ./infra/environments/prod/tfplan
          retention-days: 5

  # ─── Terraform Apply: Production ─────────────────────────────────────────────
  apply-prod:
    name: Apply (prod)
    runs-on: ubuntu-latest
    needs: plan-prod
    if: |
      github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && inputs.action == 'apply'
    environment: prod
    env:
      TF_VAR_environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ./infra/environments/prod
          environment: prod
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          backend-bucket: ${{ secrets.TF_STATE_BUCKET }}
          backend-dynamodb-table: ${{ secrets.TF_LOCK_TABLE }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod-${{ github.sha }}
          path: ./infra/environments/prod

      - name: Terraform Apply
        working-directory: ./infra/environments/prod
        run: |
          terraform apply -auto-approve tfplan

      - name: Notify on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: 'success',
              description: 'Production Terraform apply succeeded',
            });
