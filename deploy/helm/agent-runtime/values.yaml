replicaCount: 1

image:
  repository: ""  # Set to ECR_REGISTRY/mcp-agent-runtime
  pullPolicy: IfNotPresent
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 8001

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

env:
  ENVIRONMENT: "prod"
  LOG_LEVEL: "INFO"
  AWS_REGION: "us-east-1"

serviceAccount:
  create: true
  annotations: {}
  name: "mcp-agent-runtime"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
